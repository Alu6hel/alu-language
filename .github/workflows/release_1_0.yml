name: Alu 1.0 Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
          
      - name: Install LLVM & Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y llvm clang libssl-dev libz3-dev

      - name: Install LLVM & Clang (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm openssl

      - name: Build Rust Compiler
        run: cargo build --release
        
      - name: Build C++ Native Backend
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            clang++ cpp_frontend/*.cpp -o cpp_frontend/alu_cxx.exe -O3 -lws2_32
            clang++ cpp_frontend/alupm.cpp -o cpp_frontend/alupm.exe -O3
          else
            clang++ cpp_frontend/*.cpp -o cpp_frontend/alu_cxx -O3 -lcrypto -lssl
            clang++ cpp_frontend/alupm.cpp -o cpp_frontend/alupm -O3
          fi
        shell: bash

      - name: Package Artifacts (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/alu* -Destination dist/
          Copy-Item cpp_frontend/alu_cxx.exe -Destination dist/
          Copy-Item cpp_frontend/alupm.exe -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath alu-${{ runner.os }}.zip
        shell: pwsh

      - name: Package Artifacts (Unix)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/alu* dist/
          cp cpp_frontend/alu_cxx dist/
          cp cpp_frontend/alupm dist/
          tar -czvf alu-${{ runner.os }}.tar.gz -C dist .
        shell: bash
        
      - name: Upload Build Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: alu-binaries-${{ matrix.os }}
          path: alu-${{ runner.os }}.*

  release:
    name: Create GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-ecosystem:
    name: Publish VS Code & NPM Packages
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Publish NPM CLI
        run: |
          cd npm-package
          npm ci
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Publish VS Code Extension
        run: |
          cd ide/vscode-alu
          npm ci
          npm install -g @vscode/vsce
          vsce publish -p ${{ secrets.VSCE_PAT }}
