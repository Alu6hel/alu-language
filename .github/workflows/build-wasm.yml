name: Build and Publish WASM NPM Package

on:
  push:
    branches: [ "main" ]
  release:
    types: [published]

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v12
        with:
          version: latest
          
      - name: Build ALU Compiler (C++)
        run: clang++ cpp_frontend/*.cpp -o cpp_frontend/alu_cxx -O3 -lcrypto -lssl
        
      - name: Compile image_processor.alu to WASM
        run: |
          ./cpp_frontend/alu_cxx build image_processor.alu --target=wasm32-unknown-emscripten
          mv image_processor.js npm-package/
          mv image_processor.wasm npm-package/
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Publish to NPM
        if: github.event_name == 'release'
        working-directory: npm-package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
