<!DOCTYPE html>
<html>
<head>
    <title>Alu WebAssembly Simulation</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #fff; padding: 2rem; }
        .output { background: #000; padding: 1rem; border-radius: 8px; border: 1px solid #333; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>Alu WASM Physics Simulation</h1>
    <p>Loading and executing `sim.wasm` generated by the Alu compiler...</p>
    
    <div class="output" id="log"></div>

    <script>
        const logEl = document.getElementById('log');
        function log(msg) {
            logEl.innerHTML += `<div>> ${msg}</div>`;
        }

        async function initWasm() {
            try {
                const response = await fetch('sim.wasm');
                const bytes = await response.arrayBuffer();
                
                // Instantiate the WebAssembly module
                // We provide an empty import object since we compiled with -nostdlib
                const { instance } = await WebAssembly.instantiate(bytes, {
                    env: {} 
                });

                log("WASM Module Loaded Successfully.");
                
                // Call exported Alu routines
                const physicsResult = instance.exports.calculate_physics();
                log(`calculate_physics() returned: ${physicsResult}`);
                
                const vectorResult = instance.exports.add_vectors(10, 5, 20, 15);
                log(`add_vectors(10, 5, 20, 15) returned: ${vectorResult}`);

            } catch (err) {
                log(`Error: ${err.message}`);
                console.error(err);
            }
        }

        initWasm();
    </script>
</body>
</html>
