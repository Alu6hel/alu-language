AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Alu Native Image Processing API
  
  Serverless deployment of the Alu C++ engine using Pybind11

Resources:
  AluFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_function.lambda_handler
      Runtime: python3.9
      Timeout: 10
      MemorySize: 1024
      Architectures:
        - x86_64
      Events:
        ProcessImage:
          Type: Api
          Properties:
            Path: /process
            Method: post

Outputs:
  AluApi:
    Description: "API Gateway endpoint URL for Prod stage for Alu function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/process/"
  AluFunction:
    Description: "Alu Lambda Function ARN"
    Value: !GetAtt AluFunction.Arn
